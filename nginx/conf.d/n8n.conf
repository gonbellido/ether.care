server {
    listen 80;
    resolver 127.0.0.11 valid=30s;
    server_name n8n.ether.care;

    # Cloudflare Flexible: X-Forwarded-Proto=https → ya es HTTPS del lado cliente, no redirigir
    if ($http_x_forwarded_proto != "https") {
        return 301 https://$host$request_uri;
    }

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    client_max_body_size 50M;

    location / {
        set $up_n8n http://n8n:5678;
        proxy_pass $up_n8n;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 86400;
    }
}

server {
    listen 443 ssl;
    resolver 127.0.0.11 valid=30s;
    server_name n8n.ether.care;

    ssl_certificate     /etc/nginx/ssl/ether.care.pem;
    ssl_certificate_key /etc/nginx/ssl/ether.care.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    client_max_body_size 50M;

    location / {
        set $up_n8n http://n8n:5678;
        proxy_pass $up_n8n;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
