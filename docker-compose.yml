services:

  # ─── NGINX (reverse proxy + SSL Cloudflare Origin) ────
  nginx:
    image: nginx:alpine
    container_name: esoter_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - n8n
    networks:
      - esoter_net

  # ─── POSTGRESQL (CRM Espiritual) ────
  postgres:
    image: postgres:16-alpine
    container_name: esoter_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: esotersystem
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - esoter_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d esotersystem"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── QDRANT (Base vectorial RAG) ────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: esoter_qdrant
    restart: unless-stopped
    volumes:
      - ./qdrant/data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    networks:
      - esoter_net
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── REDIS (Cola de tareas + caché + LiveKit) ────
  redis:
    image: redis:7-alpine
    container_name: esoter_redis
    restart: unless-stopped
    command: [
      "redis-server",
      "--requirepass", "${REDIS_PASSWORD}",
      "--appendonly", "yes",
      "--protected-mode", "yes"
    ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./redis/data:/data
    networks:
      - esoter_net
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── N8N (Automatización + webhooks + scheduling) ────
  n8n:
    image: n8nio/n8n:latest
    container_name: esoter_n8n
    restart: unless-stopped
    environment:
      N8N_HOST: ${DOMAIN_N8N}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${DOMAIN_N8N}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: Europe/Madrid
      N8N_LOG_LEVEL: info
      N8N_EDITOR_BASE_URL: https://${DOMAIN_N8N}
      N8N_PROXY_HOPS: 1
      N8N_PUSH_BACKEND: websocket
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - ./n8n/data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - esoter_net

  # ─── CREWAI (Orquestador de agentes autónomos) ────
  crewai:
    build:
      context: ./crewai
      dockerfile: Dockerfile
    container_name: esoter_crewai
    restart: unless-stopped
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      KIMI_API_KEY: ${KIMI_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: esotersystem
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - esoter_net

  # ─── MYSQL (Fichas de paciente) ────
  mysql:
    image: mysql:8.0
    container_name: esoter_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - esoter_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MINIO (Gestor documental — wiki-raw + wiki-articles) ────
  minio:
    image: quay.io/minio/minio:latest
    container_name: esoter_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DOMAIN: ${MINIO_DOMAIN}
      MINIO_BROWSER_REDIRECT_URL: https://${DOMAIN_MINIO_CONSOLE}
    volumes:
      - ./minio/data:/data
    networks:
      - esoter_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── LIVEKIT-CONFIG (init container: genera config.yaml resuelto) ──
  livekit-config:
    image: alpine:latest
    container_name: esoter_livekit_config
    command:
      - sh
      - -c
      - |
        apk add --no-cache gettext > /dev/null 2>&1 && \
        envsubst < /src/config.yaml > /dst/config.yaml
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    volumes:
      - ./livekit:/src:ro
      - livekit-runtime:/dst
    restart: "no"

  # ─── LIVEKIT (Real-time voice AI) ────
  # network_mode: host -> evita mapear 10.000 puertos UDP (causa del cuelgue).
  # Al estar en host mode, conecta a Redis vía localhost:6379
  # (por eso Redis expone 127.0.0.1:6379 arriba).
  livekit:
    image: livekit/livekit-server:latest
    container_name: esoter_livekit
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit/config.yaml
    volumes:
      - livekit-runtime:/etc/livekit:ro
    depends_on:
      livekit-config:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # ─── SPEACHES (STT local, OpenAI-compatible, Opus/Ogg/WAV/MP3) ──
  whisper:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: esoter_whisper
    restart: unless-stopped
    ports:
      - "8080:8000"
    environment:
      WHISPER__MODEL: Systran/faster-whisper-small
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__INFERENCE_DEVICE: cpu
      ENABLE_UI: "false"
    volumes:
      - whisper-cache:/home/ubuntu/.cache/huggingface
    networks:
      - esoter_net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ─── LIVEKIT-AGENT (STT → n8n → TTS) ────────────────────
  # build: docker build -t esoter-livekit-agent ./livekit-agent
  livekit-agent:
    build:
      context: ./livekit-agent
      dockerfile: Dockerfile
    container_name: esoter_livekit_agent
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LIVEKIT_URL: ws://host.docker.internal:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/e8441923-ad2d-4b62-af61-85ef0c42aa79
      CARTESIA_API_KEY: ${CARTESIA_API_KEY}
      CARTESIA_VOICE_ID: ${CARTESIA_VOICE_ID}
      WHISPER_URL: http://whisper:8000/v1
    depends_on:
      livekit:
        condition: service_started
      whisper:
        condition: service_started
    networks:
      - esoter_net

volumes:
  livekit-runtime:
  whisper-cache:

networks:
  esoter_net:
    driver: bridge
